name: CI

# 在每次 push（main/master）与 pull_request 时自动编译并跑全量测试。
# 复用仓库已有的 Makefile：常规编译 + UBSan 构建全量测试（tests/run_tests.sh）。
# 平台用 GitHub 托管的 ubuntu-latest（原生 Linux，自带 g++/clang 与 ucontext/epoll/pthread）。
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++, clang++ ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure compiler is available
        run: |
          command -v ${{ matrix.cxx }} >/dev/null 2>&1 || {
            sudo apt-get update -y
            sudo apt-get install -y ${{ matrix.cxx }}
          }
          ${{ matrix.cxx }} --version

      - name: Ensure clang UBSan runtime is available
        # 根因说明（此前 clang job 失败的真正原因，并非代码 UB）：
        #   gcc 的 UBSan 运行时随 libgcc 一起安装（硬依赖），-fsanitize=undefined 开箱即可链接；
        #   而 clang 的 UBSan 运行时位于 compiler-rt（libclang_rt.ubsan_standalone*.a），
        #   它在 libclang-common-<ver>-dev 中只是 Recommends。runner 镜像普遍以
        #   --no-install-recommends 构建，会漏装它，于是链接期报
        #   “cannot find libclang_rt.ubsan_standalone-x86_64.a”，make check 直接 Error 2。
        # 本步骤先探测能否链接，缺则按版本安装 libclang-rt-<major>-dev 兜底。
        if: matrix.cxx == 'clang++'
        run: |
          set -e
          printf 'int main(){return 0;}\n' > /tmp/ubsan_probe.cc
          if clang++ -fsanitize=undefined /tmp/ubsan_probe.cc -o /tmp/ubsan_probe 2>/dev/null; then
            echo "clang UBSan runtime already available"
            exit 0
          fi
          CLANG_MAJOR=$(clang++ -dumpversion | cut -d. -f1)
          echo "clang UBSan runtime missing -> installing libclang-rt-${CLANG_MAJOR}-dev"
          sudo apt-get update -y
          sudo apt-get install -y "libclang-rt-${CLANG_MAJOR}-dev"
          clang++ -fsanitize=undefined /tmp/ubsan_probe.cc -o /tmp/ubsan_probe
          echo "clang UBSan runtime installed (clang ${CLANG_MAJOR})"

      - name: Regular build (no sanitizer)
        # 快速暴露普通编译错误/警告；-O0 默认，覆盖常规发布前路径。
        run: make clean && make CXX=${{ matrix.cxx }}

      - name: Build & run full test suite with UBSan
        # make check 会 clean 后以 -fsanitize=undefined -fno-sanitize-recover=all -g -O1 重建，
        # 并运行 tests/run_tests.sh（含 fork 隔离的栈溢出测试、IO 并发 CPU 断言等）。
        # 注：捕获完整输出，并把「逐测结果（=== / exit= / PASS/FAIL）+ 关键错误行」作为
        # annotation 发出，便于在 Actions 页面/API 诊断失败的具体用例（日志正文需 admin 权限）。
        run: |
          set +e
          make check CXX=${{ matrix.cxx }} 2>&1 | tee /tmp/check.log
          RC=${PIPESTATUS[0]}
          echo "make check exit=$RC"
          echo "----- per-test summary + key errors -----"
          grep -nE "^=== |^exit=|FAIL|PASS:|SOME TESTS FAILED|ALL TESTS PASS|runtime error|SUMMARY:|error:|Segmentation fault" /tmp/check.log \
            | head -80 | while IFS= read -r l; do echo "::error::${l}"; done
          exit $RC
